<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão LUAN 3D STUDIO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#1F2933',
              blue: '#1D4ED8',
              orange: '#F97316'
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 min-h-screen font-sans">

  <!-- Cabeçalho -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      <!-- Logo Oficial Luan 3D Studio -->
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full border-2 border-[#1F2933] dark:border-slate-300 bg-white flex items-center justify-center shadow-sm shrink-0">
          <svg viewBox="0 0 100 100" class="w-9 h-9" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="18" width="60" height="58" rx="8" stroke="#1F2933" stroke-width="7"/>
            <line x1="20" y1="34" x2="80" y2="34" stroke="#1F2933" stroke-width="5"/>
            <rect x="43" y="27" width="14" height="15" rx="3" fill="#1F2933"/>
            <polygon points="46,42 54,42 50,49" fill="#1F2933"/>
            <path d="M50 12 C52 18, 48 22, 50 27" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
            <path d="M50 49 C50 60, 32 58, 36 68 C40 76, 58 62, 62 70" stroke="#F97316" stroke-width="4.5" stroke-linecap="round"/>
            <polygon points="68,54 84,63 84,81 68,90 52,81 52,63" fill="white" stroke="#1D4ED8" stroke-width="5.5" stroke-linejoin="round"/>
            <polyline points="52,63 68,72 84,63" stroke="#1D4ED8" stroke-width="4.5" stroke-linejoin="round"/>
            <line x1="68" y1="72" x2="68" y2="90" stroke="#1D4ED8" stroke-width="4.5"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight leading-none">
            <span class="text-[#1F2933] dark:text-white">Luan</span>
            <span class="text-[#1D4ED8] dark:text-blue-400"> 3D Studio</span>
          </h1>
          <p id="syncStatusText" class="text-xs text-amber-600 dark:text-amber-400 font-medium mt-1 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>
            Modo Local (Use Backup para transferir)
          </p>
        </div>
      </div>

      <!-- Ações do Topo -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button onclick="toggleTheme()" title="Alternar Tema" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
          <span id="themeIcon">🌙</span>
        </button>
        <button onclick="openPdfOptionsModal()" class="px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-sm font-semibold flex items-center gap-2 transition">
          <span>📄</span> <span class="hidden sm:inline">Exportar PDF</span>
        </button>
        <button onclick="openBackupModal()" class="px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-sm font-semibold flex items-center gap-2 transition">
          <span>💾</span> <span class="hidden sm:inline">Backup</span>
        </button>
        <button onclick="openOrderModal()" class="px-4 py-2.5 rounded-xl bg-[#1D4ED8] hover:bg-blue-800 text-white text-sm font-bold shadow-sm flex items-center gap-2 transition">
          <span>+</span> <span>Novo Pedido</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Resumo Financeiro Geral (Ordem: Faturamento Bruto, A Receber, Custos, Lucro Líquido) -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">📊 Resumo Financeiro</h2>
        <span class="text-xs px-2.5 py-1 rounded-full bg-slate-200/70 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium">Total Acumulado</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- 1. Faturamento Bruto -->
        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text
